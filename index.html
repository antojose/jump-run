<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jump‑and‑Run</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="mobile-controls" class="hidden">
  <button id="btn-left" class="control-btn">←</button>
  <button id="btn-leftup" class="control-btn">↖</button>
  <button id="btn-up" class="control-btn">↑</button>
  <button id="btn-rightup" class="control-btn">↗</button>
  <button id="btn-right" class="control-btn">→</button>
</div>
<div id="mobile-msg" class="hidden">This works better with a physical keyboard.</div>
<script src="script.js"></script>
</body>
</html>
